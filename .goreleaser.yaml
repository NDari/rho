version: 2

project_name: rho

before:
  hooks:
    # The GUI embeds its web assets, so build them first.
    - npm --prefix gui/frontend ci
    - npm --prefix gui/frontend run build
    # Icon, manifest and version information for rho-gui on Windows.
    - sh gui/build/windows/syso.sh {{ .Major }}.{{ .Minor }}.{{ .Patch }}

# Release platforms: Linux (amd64, arm64), Windows (amd64) and macOS
# (Apple silicon). Each release has rho-only archives for every platform,
# and GUI archives that hold rho-gui and rho. The macOS builds have their
# own ids because the macOS GUI goes into Rho.app instead of an archive.
builds:
  - id: rho
    main: ./cmd/rho
    binary: rho
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: rho-darwin
    main: ./cmd/rho
    binary: rho
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: rho-gui
    dir: gui
    main: .
    binary: rho-gui
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    tags: [purego, production]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    overrides:
      - goos: windows
        goarch: amd64
        ldflags:
          - -s -w -H windowsgui -X main.version={{.Version}}
  - id: rho-gui-darwin
    dir: gui
    main: .
    binary: rho-gui
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    tags: [purego, production]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # rho on its own. "rho update" expects this name and layout.
  - id: rho
    ids: [rho, rho-darwin]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/configuration.md
      - docs/extensions.md
  # The GUI with the rho it runs Go extensions with. The GUI's updater
  # expects this name and layout.
  - id: rho-gui
    ids: [rho-gui, rho]
    name_template: "rho-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/configuration.md
      - docs/extensions.md
      - docs/gui.md
      - src: gui/build/linux/io.github.ndari.rho.desktop
        dst: linux/io.github.ndari.rho.desktop
      - src: gui/build/appicon.svg
        dst: linux/io.github.ndari.rho.svg
  # Not published: the macos-app job builds Rho.app from it.
  - id: rho-app
    ids: [rho-gui-darwin, rho-darwin]
    name_template: "rho-app_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE

# Signs and notarizes the macOS binaries when the Apple credentials are
# set as secrets (see docs/releasing.md).
notarize:
  macos:
    - enabled: '{{ ne (index .Env "MACOS_SIGN_P12") "" }}'
      ids: [rho-darwin, rho-gui-darwin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt
  ids: [rho, rho-gui]

# The release stays a draft until the macos-app job has added Rho.app and
# its checksum, so the updaters never see a release without them.
release:
  ids: [rho, rho-gui]
  draft: true

changelog:
  use: git
  sort: ""   # keep git log order (newest first), not alphabetical
  abbrev: 7
