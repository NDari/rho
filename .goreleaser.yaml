version: 2

project_name: rho

before:
  hooks:
    # The GUI embeds its web assets, so build them first.
    - npm --prefix gui/frontend ci
    - npm --prefix gui/frontend run build
    # Icon, manifest and version information for rho-gui on Windows.
    - sh gui/build/windows/syso.sh {{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
  - id: rho
    main: ./cmd/rho
    binary: rho
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: rho-gui
    dir: gui
    main: .
    binary: rho-gui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    tags: [purego, production]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    overrides:
      - goos: windows
        goarch: amd64
        ldflags:
          - -s -w -H windowsgui -X main.version={{.Version}}
      - goos: windows
        goarch: arm64
        ldflags:
          - -s -w -H windowsgui -X main.version={{.Version}}

archives:
  - id: rho
    ids: [rho]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/configuration.md
      - docs/extensions.md
  - id: rho-gui
    # rho comes along: rho-gui uses it to run Go extensions.
    ids: [rho-gui, rho]
    name_template: "rho-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - docs/gui.md
      - src: gui/build/linux/io.github.ndari.rho.desktop
        dst: linux/io.github.ndari.rho.desktop
      - src: gui/build/appicon.svg
        dst: linux/io.github.ndari.rho.svg

# Signs and notarizes the macOS binaries when the Apple credentials are
# set as secrets (see gui/build/darwin/bundle.sh for what they hold).
notarize:
  macos:
    - enabled: '{{ ne (index .Env "MACOS_SIGN_P12") "" }}'
      ids: [rho, rho-gui]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: ""   # keep git log order (newest first), not alphabetical
  abbrev: 7
