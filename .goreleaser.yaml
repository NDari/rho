version: 2

project_name: rho

# Release platforms: Linux (amd64, arm64), macOS (Apple silicon) and
# Windows (amd64). The GUI is released from github.com/NDari/rho-gui.
builds:
  - id: rho
    main: ./cmd/rho
    binary: rho
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # "rho update" expects this name and layout.
  - id: rho
    ids: [rho]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/configuration.md
      - docs/extensions.md

# Signs and notarizes the macOS binary when the Apple credentials are set
# as secrets (see docs/releasing.md).
notarize:
  macos:
    - enabled: '{{ ne (index .Env "MACOS_SIGN_P12") "" }}'
      ids: [rho]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: ""   # keep git log order (newest first), not alphabetical
  abbrev: 7
