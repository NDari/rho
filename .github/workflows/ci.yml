name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: gui/frontend
      - name: Check frontend
        run: npm run check
        working-directory: gui/frontend
      - name: Build frontend
        run: npm run build
        working-directory: gui/frontend
      - name: Vet
        run: go vet -tags purego ./...
      - name: Test
        run: go test -race -tags purego ./...
      - name: Build for each platform
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -tags purego,production -o /dev/null .
          done
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: gui
          args: --build-tags purego
