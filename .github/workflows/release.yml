name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  # Wraps the macOS release binaries into Rho.app and adds it to the release.
  macos-app:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the macOS archives
        run: gh release download "$GITHUB_REF_NAME" --pattern 'rho-gui_*_darwin_*.tar.gz' --dir dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Rho.app
        run: sh gui/build/darwin/bundle.sh "${GITHUB_REF_NAME#v}" dist
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: Upload Rho.app
        run: gh release upload "$GITHUB_REF_NAME" dist/Rho_*_macos.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
