name: GUI

# The GUI job is the slow one, so it runs only when the GUI or the core
# it uses changes, and before each release (release.yml calls it).
on:
  push:
    branches: [main]
    paths: ["gui/**", "core/**", "go.mod", "go.sum", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "core/**", "go.mod", "go.sum", ".github/workflows/gui.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  gui:
    runs-on: ubuntu-latest
    env:
      # Wails' pure-Go backend; with cgo some Wails packages need GTK headers.
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: gui/frontend
      - name: Check frontend
        run: npm run check
        working-directory: gui/frontend
      - name: Build frontend
        run: npm run build
        working-directory: gui/frontend
      - name: Vet
        run: go vet -tags purego ./...
      - name: Test
        # The bridge does not import Wails, so it can use the race detector.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./bridge/...
      - name: Build for each platform
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -tags purego,production -o /dev/null .
          done
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: gui
          args: --build-tags purego
